name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# ─── Job 1: Typecheck · Lint · Tests unitarios · Build ────────

jobs:
  unit:
    name: Typecheck · Lint · Tests · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # Typecheck con tsconfig propio — no depende de artefactos del build anterior
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests unitarios
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-build
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key-for-build
          SUPABASE_PROJECT_REF: placeholder-ref
          FIRST_ADMIN_EMAIL: admin@example.com

# ─── Job 2: Tests de integración RLS contra Supabase local ────

  integration:
    name: Tests de integración RLS (Supabase local)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar dependencias
        run: npm ci

      - name: Levantar Supabase local
        run: supabase start

      - name: Exportar credenciales del Supabase local
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          echo "TEST_SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "TEST_SUPABASE_ANON_KEY=${ANON_KEY}" >> "$GITHUB_ENV"
          echo "TEST_SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}" >> "$GITHUB_ENV"
          echo "TEST_SUPABASE_JWT_SECRET=${JWT_SECRET}" >> "$GITHUB_ENV"

      - name: Tests de integración RLS
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:54322/postgres

# ─── Job 3: e2e Playwright contra stack efímero (Next + Supabase local) ────
# FB-F4-11: reusa la misma infra de Supabase local que el job de integración
# (Postgres fresco + migraciones aplicadas por `supabase start`). Regla dura
# de seguridad: este job SOLO escribe contra esa base efímera — nunca prod,
# no existe ninguna variable acá que apunte a otra cosa. Sin envío real de
# mail: al no setear GMAIL_SENDER_ADDRESS/GOOGLE_SERVICE_ACCOUNT_KEY_B64,
# sendEmail() tira y cada acción de resolución lo atrapa (best-effort, ver
# aprobaciones/*-actions.ts) sin bloquear el flujo ni pegarle a Gmail real.

  e2e:
    name: E2E Playwright (stack efímero)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegadores de Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Levantar Supabase local
        run: supabase start

      - name: Exportar credenciales del Supabase local + generar credenciales e2e
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
          } >> "$GITHUB_ENV"
          # Credenciales de los 3 roles e2e — generadas al vuelo en este job
          # efímero, NUNCA hardcodeadas en el repo (§4 del prompt FB-F4-11).
          {
            echo "E2E_ADMIN_EMAIL=e2e-admin@firstblades.test"
            echo "E2E_ADMIN_PASSWORD=$(openssl rand -base64 24)"
            echo "E2E_SUPERVISOR_EMAIL=e2e-supervisor@firstblades.test"
            echo "E2E_SUPERVISOR_PASSWORD=$(openssl rand -base64 24)"
            echo "E2E_EMPLEADO_EMAIL=e2e-empleado@firstblades.test"
            echo "E2E_EMPLEADO_PASSWORD=$(openssl rand -base64 24)"
          } >> "$GITHUB_ENV"

      - name: Seed determinístico (admin + supervisor + empleado a cargo)
        run: npm run seed:e2e

      - name: Build + e2e (Playwright, Chromium)
        run: npm run test:e2e

      - name: Subir reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
