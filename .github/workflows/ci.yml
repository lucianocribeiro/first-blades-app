name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# ─── Job 1: Typecheck · Lint · Tests unitarios · Build ────────

jobs:
  unit:
    name: Typecheck · Lint · Tests · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # Typecheck con tsconfig propio — no depende de artefactos del build anterior
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests unitarios
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-build
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key-for-build
          SUPABASE_PROJECT_REF: placeholder-ref
          FIRST_ADMIN_EMAIL: admin@example.com

# ─── Job 2: Tests de integración RLS contra Supabase local ────

  integration:
    name: Tests de integración RLS (Supabase local)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar dependencias
        run: npm ci

      - name: Levantar Supabase local
        run: supabase start

      - name: Tests de integración RLS
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:54322/postgres
          # Storage API — mismas variables que lib/supabase/admin.ts.
          # Valores por defecto del supabase start sin jwt_secret customizado.
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
