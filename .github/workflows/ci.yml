name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# ─── Job 1: Typecheck · Lint · Tests unitarios · Build ────────

jobs:
  unit:
    name: Typecheck · Lint · Tests · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # Typecheck con tsconfig propio — no depende de artefactos del build anterior
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests unitarios
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-build
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key-for-build
          SUPABASE_PROJECT_REF: placeholder-ref
          FIRST_ADMIN_EMAIL: admin@example.com

# ─── Job 2: Tests de integración RLS contra PostgreSQL real ───

  integration:
    name: Tests de integración RLS (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_first_blades
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Tests de integración RLS
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_first_blades
